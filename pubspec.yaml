name: fourteen_november
description: "A new Flutter project."

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.2.0+3

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  hive_ce: ^2.22.0
  hive_ce_flutter: ^2.3.4
  path_provider: ^2.1.4
  go_router: ^17.0.0
  google_fonts: ^6.3.2
  intl: ^0.20.2
  cached_network_image: ^3.4.0
  flutter_launcher_icons: ^0.14.3
  http: ^1.6.0
  image_picker: 1.0.4
  timezone: ^0.9.4
  shimmer: ^3.0.0
  latlong2: ^0.10.1
  appwrite: ^25.4.0
  geolocator: ^14.0.2
  lucide_icons_flutter: ^4.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  hive_ce_generator: ^1.12.0
  build_runner: ^2.16.2

flutter:
  uses-material-design: true

  assets:
    - assets/icon/icon.png

  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/outfit/Outfit-Light.ttf
          weight: 300
        - asset: assets/fonts/outfit/Outfit-Regular.ttf
        - asset: assets/fonts/outfit/Outfit-Medium.ttf
          weight: 500
        - asset: assets/fonts/outfit/Outfit-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/outfit/Outfit-Bold.ttf
          weight: 700
        - asset: assets/fonts/outfit/Outfit-Black.ttf
          weight: 900

    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/vazirmatn/Vazirmatn-Light.ttf
          weight: 300
        - asset: assets/fonts/vazirmatn/Vazirmatn-Regular.ttf
        - asset: assets/fonts/vazirmatn/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/vazirmatn/Vazirmatn-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/vazirmatn/Vazirmatn-Bold.ttf
          weight: 700
        - asset: assets/fonts/vazirmatn/Vazirmatn-Black.ttf
          weight: 900

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/icon/icon.png"
